[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-doctor"
version = "1.0.0"
description = "Dependency-free CSV profiling and quality checks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ankita Banerjee" }]

[project.scripts]
dataset-doctor = "dataset_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
